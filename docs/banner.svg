<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="12" fill="url(#bg)"/>

  <!-- p, q -->
  <g>
    <rect x="30" y="80" width="90" height="60" rx="8" fill="#334155" stroke="#64748b"/>
    <text x="75" y="105" fill="#e2e8f0" font-size="16" text-anchor="middle">p, q</text>
    <text x="75" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">primes</text>
  </g>

  <!-- arrow -->
  <line x1="120" y1="110" x2="180" y2="110" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- keygen -->
  <g>
    <rect x="185" y="70" width="130" height="80" rx="8" fill="#1d4ed8" stroke="#60a5fa"/>
    <text x="250" y="100" fill="#f8fafc" font-size="15" text-anchor="middle">rsa_keygen</text>
    <text x="250" y="120" fill="#dbeafe" font-size="11" text-anchor="middle">n, phi, d</text>
    <text x="250" y="136" fill="#dbeafe" font-size="10" text-anchor="middle">modinv (gcd.asm)</text>
  </g>

  <line x1="315" y1="110" x2="375" y2="110" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- encrypt -->
  <g>
    <rect x="380" y="70" width="140" height="80" rx="8" fill="#7c3aed" stroke="#a78bfa"/>
    <text x="450" y="100" fill="#f8fafc" font-size="15" text-anchor="middle">rsa_encrypt</text>
    <text x="450" y="120" fill="#ede9fe" font-size="11" text-anchor="middle">modexp(m, e, n)</text>
    <text x="450" y="136" fill="#ede9fe" font-size="10" text-anchor="middle">square-and-multiply</text>
  </g>

  <line x1="520" y1="110" x2="580" y2="110" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decrypt -->
  <g>
    <rect x="585" y="70" width="140" height="80" rx="8" fill="#0f766e" stroke="#2dd4bf"/>
    <text x="655" y="100" fill="#f8fafc" font-size="15" text-anchor="middle">rsa_decrypt</text>
    <text x="655" y="120" fill="#ccfbf1" font-size="11" text-anchor="middle">modexp(c, d, n)</text>
    <text x="655" y="136" fill="#ccfbf1" font-size="10" text-anchor="middle">bignum.asm mod_mul</text>
  </g>

  <line x1="725" y1="110" x2="785" y2="110" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- result -->
  <g>
    <rect x="790" y="80" width="90" height="60" rx="8" fill="#334155" stroke="#64748b"/>
    <text x="835" y="105" fill="#e2e8f0" font-size="14" text-anchor="middle">m</text>
    <text x="835" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">recovered</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="450" y="195" fill="#64748b" font-size="12" text-anchor="middle">x86-64 NASM · System V ABI · pure assembly</text>
</svg>
