<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <rect width="760" height="360" rx="12" fill="#0b1220"/>
  <text x="380" y="34" fill="#f1f5f9" font-size="17" text-anchor="middle" font-weight="bold">modexp: square-and-multiply</text>
  <text x="380" y="54" fill="#94a3b8" font-size="11" text-anchor="middle">result = 1; base = b; for each bit of exp (LSB to MSB):</text>

  <!-- loop box -->
  <rect x="60" y="80" width="640" height="220" rx="10" fill="#111827" stroke="#334155"/>

  <!-- step 1 -->
  <g>
    <rect x="90" y="105" width="220" height="60" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="200" y="130" fill="#dbeafe" font-size="13" text-anchor="middle">exp &amp; 1 == 1 ?</text>
    <text x="200" y="148" fill="#93c5fd" font-size="10" text-anchor="middle">test r13, 1</text>
  </g>

  <line x1="310" y1="135" x2="380" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#a2)"/>
  <text x="345" y="125" fill="#38bdf8" font-size="10" text-anchor="middle">yes</text>

  <g>
    <rect x="385" y="105" width="240" height="60" rx="8" fill="#5b21b6" stroke="#a78bfa"/>
    <text x="505" y="130" fill="#ede9fe" font-size="13" text-anchor="middle">result = (result * base) mod m</text>
    <text x="505" y="148" fill="#ddd6fe" font-size="10" text-anchor="middle">call mod_mul</text>
  </g>

  <!-- step 2 -->
  <g>
    <rect x="90" y="195" width="220" height="60" rx="8" fill="#065f46" stroke="#34d399"/>
    <text x="200" y="220" fill="#d1fae5" font-size="13" text-anchor="middle">base = (base * base) mod m</text>
    <text x="200" y="238" fill="#a7f3d0" font-size="10" text-anchor="middle">call mod_mul</text>
  </g>

  <line x1="200" y1="165" x2="200" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

  <g>
    <rect x="385" y="195" width="240" height="60" rx="8" fill="#7c2d12" stroke="#fb923c"/>
    <text x="505" y="220" fill="#ffedd5" font-size="13" text-anchor="middle">exp = exp &gt;&gt; 1</text>
    <text x="505" y="238" fill="#fed7aa" font-size="10" text-anchor="middle">shr r13, 1</text>
  </g>

  <line x1="200" y1="255" x2="200" y2="280" stroke="#64748b" stroke-width="2"/>
  <line x1="200" y1="280" x2="505" y2="280" stroke="#64748b" stroke-width="2"/>
  <line x1="505" y1="280" x2="505" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

  <line x1="505" y1="165" x2="505" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

  <!-- loop back -->
  <path d="M 625 225 C 690 225, 690 130, 630 130" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="700" y="180" fill="#64748b" font-size="10" text-anchor="middle" transform="rotate(90 700 180)">repeat while exp != 0</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="380" y="335" fill="#94a3b8" font-size="11" text-anchor="middle">returns result = base^exp mod m</text>
</svg>
